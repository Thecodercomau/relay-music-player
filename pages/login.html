<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Relay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="auth-body">
  <nav class="navbar navbar--simple">
    <a href="../index.html" class="navbar__brand">
      <span class="navbar__logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      Relay
    </a>
    <ul class="navbar__links">
      <li><a href="../index.html" class="nav-link">Home</a></li>
      <li><a href="signup.html" class="nav-link">Sign Up</a></li>
    </ul>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card__head">
        <span class="auth-card__logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <h1>Welcome back</h1>
        <p>Log in to keep the music playing.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field__password">
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
            <button type="button" class="field__toggle" data-toggle-target="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <p class="form-error" id="formError" role="alert" hidden></p>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
          <span class="btn__label">Log in</span>
          <span class="btn__spinner" hidden></span>
        </button>
      </form>

      <p class="auth-card__foot">New to Relay? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
